name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run pytest -m "not realdata"
      - name: Windows run script on the Windows fixture image
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\run.ps1 -Evidence tests\fixtures\images\windows.E01 -CaseDir "$env:RUNNER_TEMP\case" -CaseName ci -Examiner ci -Org ci -NoPrompt -NoOpen
